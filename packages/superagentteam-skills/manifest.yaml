version: 1
skills:
  - skillId: superagentteam-verify
    path: skills/superagentteam-verify
    sourceKind: repo-local
    category: delivery
    not_for:
      - docs-only changes with no behavior impact
      - unrelated bug fixing
    output: "verification commands and their observed results"
    next: superagentteam-review
    sop_step: quality-gate
  - skillId: superagentteam-review
    path: skills/superagentteam-review
    sourceKind: repo-local
    category: review
    not_for:
      - author self-approval
      - vision-level decisions
    output: "finding list with severity and stance"
    next: null
    sop_step: request-review
  - skillId: superagentteam-rich-messaging
    path: skills/superagentteam-rich-messaging
    sourceKind: repo-local
    category: presentation
    not_for:
      - plain text answers that need no structure
      - approval or permission cards
    output: "one or more rich blocks attached to the current response"
    next: null
    sop_step: response-composition
